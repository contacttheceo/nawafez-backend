name: Deploy Laravel to Freehostia

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, json

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          php artisan key:generate --force

      - name: Create required storage directories
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/app/public
          mkdir -p storage/logs
          mkdir -p bootstrap/cache
          touch storage/logs/.gitkeep
          touch storage/app/public/.gitkeep

      - name: Optimize for production
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Deploy via FTP to Freehostia
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /www/nwafiz.creativealphat.com/
          exclude: |
            **/.git/**
            **/node_modules/**
            **/tests/**
            **/.env.example
            **/README.md
            **/.gitignore
